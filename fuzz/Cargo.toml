[package]
name = "anywhere-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
[package.metadata]
cargo-fuzz = true
[workspace]
[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.13"
tempfile = "3.27.0"
control-api = { package = "anywhere-api-types", path = "../crates/control-api" }
appspec = { path = "../crates/appspec" }
manifest = { path = "../crates/manifest" }
naming = { path = "../crates/naming" }
uuid = { version = "1.28.0", features = ["v7"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
tar = { version = "0.4.46", default-features = false }

[[bin]]
name = "appspec_parse"
path = "fuzz_targets/appspec_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "appspec_check"
path = "fuzz_targets/appspec_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_check"
path = "fuzz_targets/manifest_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app_address"
path = "fuzz_targets/app_address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pull_untar"
path = "fuzz_targets/pull_untar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "app_icon"
path = "fuzz_targets/app_icon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_reference"
path = "fuzz_targets/image_reference.rs"
test = false
doc = false
bench = false

[[bin]]
name = "logs_follow"
path = "fuzz_targets/logs_follow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "public_apps"
path = "fuzz_targets/public_apps.rs"
test = false
doc = false
bench = false
